# 80 / 443 总入口，两种入口并存：
#   ① 子域名  my-workspace.<域名>  → 整个站交给周工作台
#   ② 默认    IP 或其它 Host      → /workbench/ 走工作台，其余给 buddy
#
# 为什么要有 ②：IP 直连时没有域名可匹配，留一条路径入口兜底。
# 前端用相对路径，两种挂载方式共用同一份构建。
#
# 注：真实域名是 324614917.xyz（9 位数字）。早期误配的 3246146917.xyz（10 位）
# 从未在注册局存在，保留其 server_name 只为占位，不影响任何访问。

# ---------- 访问日志 ----------
# 镜像自带的格式只有 IP、请求行和 UA：没有域名（根请求没有 referer，grep 域名时整行会漏掉），
# 也没有耗时（分不清「没请求」和「请求慢了 9 秒」）。conf.d 被 include 在 http 上下文里，
# 所以格式可以直接在这里定义并启用，不用改镜像里的 nginx.conf。
# 排障用法：rt= 是单请求耗时，>0.5 的就是慢请求；urt= 是到后端的耗时，为 - 说明没走代理。
log_format bench '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_referer" "$http_user_agent" '
                 '"$http_x_forwarded_for"';
access_log /var/log/nginx/access.log bench;

# ---------- ① 子域名：整个站就是工作台 ----------
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name my-workspace.324614917.xyz my-workspace.3246146917.xyz;

    # 自签证书，专给 Cloudflare 回源用：
    #   Cloudflare SSL 模式选 "Full"（不校验源站证书）即可；
    #   选 "Full (strict)" 会报 526，那需要换成 Cloudflare Origin CA 证书。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 压缩：源站直连（不走 Cloudflare）时这层是唯一的一道。
    # nginx 默认只压 text/html，CSS/JS 不压就得原样过网。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 50m;

    location / {
        proxy_pass http://workbench:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------- ② 默认入口：按路径分发 ----------
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 50m;

    # 子路径必须带尾斜杠，否则页面里的相对路径会解析到根，打到 buddy 去
    location = /workbench {
        return 301 /workbench/;
    }

    location /workbench/ {
        proxy_pass http://workbench:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # buddy 的 /api/kb/stream 是 SSE，不关缓冲会攒着一起来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
