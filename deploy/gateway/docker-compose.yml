services:
  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂目录而不是单文件：替换单文件会换 inode，容器里仍是旧 inode，
      # reload 看似成功实则加载旧配置（踩过一次）。
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - vbcd
      - workbench
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vbcd:
    external: true
    name: vbcd_internal
  workbench:
    external: true
    name: workbench_default
