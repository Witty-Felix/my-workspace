# 80 端口总入口：/workbench/ 交给周工作台，其余全部交给 buddy
# 存在的理由：80 原本被 buddy 的 web 容器独占，而它的 nginx 配置打在镜像里，
# 没法零侵入地加 location。于是让它退到 127.0.0.1:8080，由这一层统一分发。

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # 子路径必须带尾斜杠，否则页面里的相对路径会解析到根，打到 buddy 去
    location = /workbench {
        return 301 /workbench/;
    }

    location /workbench/ {
        proxy_pass http://workbench:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # buddy 的 /api/kb/stream 是 SSE，不关缓冲会攒着一起来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
