# 80 端口总入口，两种入口并存：
#   ① 子域名  my-workspace.<域名>  → 整个站交给周工作台
#   ② 默认    IP 或其它 Host      → /workbench/ 走工作台，其余给 buddy
#
# 为什么要有 ②：域名 3246146917.xyz 至今未注册（RDAP 404），子域名没解析就没法访问，
# 留一条路径入口兜底，两种地址都能用。前端用相对路径，两种挂载方式共用同一份构建。

# ---------- ① 子域名：DNS 指向本机后即生效 ----------
server {
    listen 80;
    listen 443 ssl;
    server_name my-workspace.3246146917.xyz;

    # 自签证书，专给 Cloudflare 回源用：
    #   Cloudflare SSL 模式选 "Full"（不校验源站证书）即可；
    #   选 "Full (strict)" 会报 526，那需要换成 Cloudflare Origin CA 证书。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://workbench:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------- ② 默认入口：按路径分发 ----------
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # 子路径必须带尾斜杠，否则页面里的相对路径会解析到根，打到 buddy 去
    location = /workbench {
        return 301 /workbench/;
    }

    location /workbench/ {
        proxy_pass http://workbench:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # buddy 的 /api/kb/stream 是 SSE，不关缓冲会攒着一起来
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
