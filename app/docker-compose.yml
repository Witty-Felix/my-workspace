services:
  workbench:
    build: .
    image: workbench:latest
    container_name: workbench
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Asia/Shanghai
      AUTH: ${AUTH:-basic}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASS: ${AUTH_PASS}
      # 助手：没配 AI_KEY 时 /api/chat 返回 503，其余功能不受影响
      AI_KEY: ${AI_KEY:-}
      AI_BASE: ${AI_BASE:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
