services:
  workbench:
    build: .
    image: workbench:latest
    container_name: workbench
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Asia/Shanghai
      AUTH: ${AUTH:-basic}
      AUTH_USER: ${AUTH_USER}
      AUTH_PASS: ${AUTH_PASS}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
