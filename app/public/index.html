<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E2DB" id="metaTheme">
<title>周工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23F5C518' stroke='%231A1A18' stroke-width='1.7' stroke-linejoin='round' d='M12 2.6l1.9 6.2 6.2 1.9-6.2 1.9L12 18.8l-1.9-6.2L3.9 10.7l6.2-1.9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">

<!-- 首屏预取：HTML 一解析就把本周数据请求打出去，和 CSS/JS 的下载并行。
     原来要等 app.js 下载并执行完才发请求，等于白等一个完整往返——跨境链路下这一下就是 1~2 秒。
     app.js 会复用这里的 promise（见 app.js 的 loadWeek），失败也照常走原有的重试路径。 -->
<script>
(function () {
  var p = function (n) { return n < 10 ? '0' + n : '' + n; };
  var ymd = function (d) { return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
  var now = new Date();
  var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
  var from = ymd(start);
  var to = ymd(end);
  // ISO 周标识，和 app.js 的 isoWeek 同一算法：周规划要按周取，不能靠日期区间推
  var isoWeek = function (d) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    var week1 = new Date(t.getFullYear(), 0, 4);
    var w = 1 + Math.round(((t - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
    return t.getFullYear() + '-W' + p(w);
  };
  var week = isoWeek(start);
  try {
    window.__WB_BOOT__ = {
      from: from,
      to: to,
      week: week,
      data: fetch('api/items?from=' + from + '&to=' + to + '&week=' + week)
        .then(function (r) {
          if (!r.ok) throw new Error('请求失败（' + r.status + '）');
          return r.json();
        })
    };
  } catch (e) {
    window.__WB_BOOT__ = null;
  }
})();
</script>
</head>
<body>

<!-- 手绘抖动的两颗滤镜：大件 0.035/0.042 · seed 42 · scale 4.5；小件 0.06 · seed 7 · scale 2.5
     两颗紧凑档变体：同 seed、幅度乘 0.45，只用于页头那枚 16px 的开关 -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="sketchy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency="0.035 0.042" numOctaves="4" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchy-sm" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="turbulence" baseFrequency="0.06" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchy-c" x="-14%" y="-14%" width="128%" height="128%">
      <feTurbulence type="turbulence" baseFrequency="0.05 0.06" numOctaves="3" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sketchy-k" x="-18%" y="-18%" width="136%" height="136%">
      <feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<header class="bar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.6l1.9 6.2 6.2 1.9-6.2 1.9L12 18.8l-1.9-6.2L3.9 10.7l6.2-1.9z"/>
    </svg>
    <span>周工作台</span>
  </div>

  <nav class="nav">
    <button class="ic" id="prev" aria-label="上一周">‹</button>
    <button class="wk" id="wkBtn" title="回到本周">
      <span class="wk-key" id="wkKey">—</span>
      <span class="wk-range" id="wkRange">—</span>
    </button>
    <button class="ic" id="next" aria-label="下一周">›</button>
    <button class="tag" id="planBtn" aria-pressed="false">规划</button>
    <button class="tag" id="todayBtn">本周</button>
  </nav>

  <label class="hs hs--sm" title="白天 / 夜间">
    <input class="hs__input" id="themeSwitch" type="checkbox" role="switch" aria-label="夜间模式">
    <div class="hs__container">
      <div class="hs__clouds"></div>
      <div class="hs__stars">
        <svg viewBox="0 0 144 55" fill="currentColor" width="100%">
          <path d="M14 0l2 9.5 9.5 2-9.5 2-2 9.5-2-9.5L2.5 11.5 12 9.5z"/>
          <path d="M58 12l1.6 7.6 7.6 1.6-7.6 1.6L58 30.4l-1.6-7.6L48.8 21.2l7.6-1.6z"/>
          <path d="M104 4l1.2 5.7 5.7 1.2-5.7 1.2-1.2 5.7-1.2-5.7-5.7-1.2 5.7-1.2z"/>
          <path d="M130 28l1 4.8 4.8 1-4.8 1-1 4.8-1-4.8-4.8-1 4.8-1z"/>
        </svg>
      </div>
      <div class="hs__glow">
        <div class="hs__sun">
          <div class="hs__moon">
            <div class="hs__spot"></div>
            <div class="hs__spot"></div>
            <div class="hs__spot"></div>
          </div>
        </div>
      </div>
      <div class="hs__cluster"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="hs__aurora"></div>
      <div class="hs__comets"><i></i><i></i></div>
    </div>
  </label>
</header>

<main class="stage">
  <section class="sheet" id="week" aria-label="本周安排"></section>

  <!-- 手机端：规划与当天各一页，标签切换。桌面上这两个节点被 CSS 隐藏 -->
  <div class="mtabs" id="mTabs" role="tablist">
    <button class="mtab on" role="tab" aria-selected="true" data-page="plan" id="mtabPlan">规划<span class="mtab-n" id="mPlanCount"></span></button>
    <button class="mtab" role="tab" aria-selected="false" data-page="week" id="mtabWeek">当天</button>
  </div>

  <section class="mplan" id="mPlan" aria-label="周规划">
    <div class="pw-card">
      <div class="pw-card-head">
        <span class="pw-card-t" id="mPlanTitle">本周规划</span>
        <span class="pw-card-n" id="mPlanNum">空</span>
        <span class="sp"></span>
        <span class="pw-card-saved" id="mPlanSaved">已保存</span>
      </div>
      <div class="pw-card-list" id="mPlanList"></div>
      <button type="button" class="pw-card-add" id="mPlanAdd">
        <svg class="ico sm" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
        添加一条
      </button>
    </div>
  </section>

  <section class="phone" id="phone" aria-label="按天查看">
    <div class="phone-week">
      <button class="ic" id="pPrevW" aria-label="上一周">‹</button>
      <div class="strip" id="pStrip" role="group" aria-label="选择日期"></div>
      <button class="ic" id="pNextW" aria-label="下一周">›</button>
    </div>
    <div class="phone-paper">
      <div class="phone-day" id="pDay">—</div>
      <div class="phone-list" id="pList"></div>
    </div>
  </section>
</main>

<dialog id="editor" class="editor">
  <form id="form" novalidate>
    <p class="ed-date" id="edDate">—</p>
    <div class="seg" id="seg"></div>
    <input id="fTitle" class="in" maxlength="80" placeholder="要做什么？" autocomplete="off">
    <textarea id="fNote" class="in" maxlength="500" rows="2" placeholder="备注（可选）"></textarea>
    <p class="err" id="err" hidden></p>
    <div class="foot">
      <button type="button" class="btn danger" id="delBtn" hidden>删除</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="cancelBtn">取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>
<script src="domain.js"></script>
<script src="app.js"></script>
</body>
</html>
